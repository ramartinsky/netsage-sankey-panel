# Builds, signs (if GRAFANA_ACCESS_POLICY_TOKEN is set) and drafts a GitHub release
# with the plugin zip when a version tag (e.g. v1.0.0) is pushed.
# See https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          # Repository secret; create the token at grafana.com > My Account > Access Policies
          # (scope: plugins:write). Leave unset to publish an unsigned build.
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
